<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Fetch API</title>
  </head>

  <body class="w-screen h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="bg-green-400 p-5 flex justify-between items-center">
      <h1 id="nav-title" class="text-2xl text-white font-bold">Post Content</h1>

      <div class="flex gap-6 font-semibold">
        <a id="navDummy" href="index.html" class="transition-all duration-300">
          Dummy Data
        </a>
        <a id="navFetch" href="fetch.html" class="transition-all duration-300">
          Fetch API
        </a>
      </div>
    </nav>

    <!-- Content -->
    <main
      class="w-screen h-screen overflow-auto flex flex-col justify-start items-center gap-10 p-4 md:px-[10%] xl:py-10 xl:px-[20%]"
    >
      <!-- Form -->
      <form
        id="postForm"
        class="bg-green-400 px-4 py-4 rounded flex flex-col justify-center items-center w-full gap-4"
      >
        <h2 id="formTitle" class="text-white text-xl font-bold">Tambah Post</h2>

        <!-- simpan id saat edit -->
        <input type="hidden" id="postId" />

        <div class="text-white w-full flex flex-col">
          <label for="title">Title</label>
          <input
            type="text"
            placeholder="title"
            name="title"
            id="title"
            class="px-2 py-1 border border-white rounded text-white bg-transparent"
            required
          />
        </div>

        <div class="text-white w-full flex flex-col">
          <label for="body">Description</label>
          <textarea
            type="text"
            placeholder="description"
            name="body"
            id="body"
            class="px-2 py-1 border border-white rounded text-white bg-transparent"
            required
          ></textarea>
        </div>

        <button
          id="submitBtn"
          type="submit"
          class="bg-white py-2 px-8 rounded text-green-400 cursor-pointer font-bold"
        >
          Save
        </button>
      </form>

      <!-- List Post -->
      <section id="postList" class="w-full flex flex-col gap-4">
        <!-- Data dari API akan tampil di sini -->
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-green-400 p-2 flex justify-center">
      <p class="text-sm text-white">v.x.x.x © Copyright 2026 VO</p>
    </footer>

    <!-- JS -->
    <!-- informasi
    1. Index
    Index dimulai dengan urutan 0.
      umum -> 1,2,3,4,5,dst
      komputer -> 0,1,2,3,4,dst
    Index digunakan sebagai urutan untuk data array. 

    2. Pemanggilan file JS
    Tidak bisa memakai tag script yang sama dalam memanggil file js dan membuat js internal html.
    - Contoh salah
      <script src="script.js">
        console.log
      </script>
    - Contoh Benar
      <script src="script.js"></script>
      <script>
        console.log
      </script>

    3. JSON
    JSON, singkatan dari JavaScript Object Notation, adalah suatu format ringkas pertukaran data komputer. 
    Formatnya berbasis teks dan terbaca-manusia serta digunakan untuk merepresentasikan struktur data sederhana dan larik asosiatif.
    
    5. Penggunaan Synchronous dan Asynchronous.
    bisa jadi harus menyesuaikan dengan ketentuan dari API.
    Jadi jika data tidak tampil ketika menampilkannya secara Synchronous maka gunakan Asynchronous.
    Begitu juga sebaliknya


    6. Update dan Delete
    Untuk update dan delete biasanya harus mengirimkan id pada parameter api.
    Jika mau mencobanya, untuk jsonplaceholder maka hanya akan muncul status, tidak menyimpannya ke dalam API yang akan dihit kembali.
    -->
    <script src="script.js"></script>
    <script>
      // Alur proses menampilkan data API
      // 1. Membuat array kosong
      // 2. Mengambil data API untuk method GET
      // 3. Memasukan data API ke dalam Array
      // 4. Menampilkannya ke HTML menggunakan dom

      // Alur proses menambahkan data API
      // 1. Mengambil value dari Input Form
      // 2. Menyimpannya dalam 1 object
      // 3. Mengirimnya ke API untuk method POST
      // 4. Menampilkannya ke HTML menggunakan dom
      // 5. Reset Form

      // ----- Synchronous
      // fetch("https://jsonplaceholder.typicode.com/posts")
      //   .then((resp) => console.log("then 1=", resp))
      //   .then((data) => console.log("then 2 =", data.body))
      //   .catch((err) => console.log("error =", err));

      // ----- Asynchronous
      let dataPost = [];

      // Function untuk mengambil data API
      async function getPost() {
        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts",
          ); // Mengambil data API
          let data = await response.json(); // Mengubah respon menjadi JSON

          data = data.slice(0, 5); // mengambil index yang akan ditampilkan.
          dataPost = data; // Memasukan data API ke dalam array

          renderCard(); // Memamggil fungsi render card
        } catch (error) {
          // Jika terdapat error dalam proses maka akan masuk ke sini
          console.log("error =", error);
        }
      }

      // Function untuk membuat data ke API
      async function postContent(body) {
        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts",
            {
              method: "POST",
              body: body,
            },
          );
          let data = await response.json(); // Mengubah respon menjadi JSON

          alert("Post berhasil ditambahkan (simulasi API)");
        } catch (error) {
          alert("Terjadi di server!");
          console.log("error =", error);
        }
      }

      // Function untuk menampilkan data
      function renderCard() {
        let containerPost = document.getElementById("postList");
        containerPost.innerHTML = ""; // digunakan untuk mengkosongkan html sebelum di loop

        // Lopping menggunakan FOR LOOP
        for (let i = 0; i < dataPost.length; i++) {
          const id = dataPost[i].id; // mengambil data API dengan key "id" berdasarkan index yang di loop
          const title = dataPost[i].title; // mengambil data API dengan key "title" berdasarkan index yang di loop
          const body = dataPost[i].body; // mengambil data API dengan key "body" berdasarkan index yang di loop

          containerPost.innerHTML += `
          <article class="bg-white border-2 rounded border-green-500 p-4">
            <p class="text-sm text-green-800 bg-blue-500 rounded-full text-white text-center w-10">
              ${i + 1}
            </p>
            <h1 class="font-bold text-xl text-green-500">${title}</h1>
            <p class="text-sm text-green-800">${body}</p>
  
            <div class="flex gap-2 mt-3">
              <button class="bg-yellow-400 px-4 py-1 rounded text-white text-sm">
                Edit
              </button>
  
              <button class="bg-red-500 px-4 py-1 rounded text-white text-sm">
                Delete
              </button>
            </div>
          </article>`;
        }
      }

      // DOM untuk mengambil data Form
      let formContent = document.getElementById("postForm");

      formContent.addEventListener("submit", function (e) {
        e.preventDefault(); // membuat form tidak load ketika dikirim

        const title = document.getElementById("title").value; // mengambil value input dengan id title
        const description = document.getElementById("body").value; // mengambil value input dengan id body

        // Membuat variabel untuk menyimpan input
        const body = {
          id: dataPost.length + 1, // manual key = id | value = banyak data + 1
          title, // otomatis key = nama variable
          body: description, // manual key = body | value = diambil dari input html
        };

        postContent(body); // Menambahkan data API

        renderCard(); // untuk merender html jika menambah data
        formContent.reset(); // untuk mereset input form
      });

      getPost(); // untuk merender html saat pertama kali di buka
    </script>
  </body>
</html>
