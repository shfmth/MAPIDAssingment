<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS MAPID - MapLibre Bootcamp</title>
    <!-- [Slide 3] Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <!-- CDN TURF JS -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { height: calc(100vh); }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        #result li { 
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background-color: white;
            border: 1px solid #f1f5f9;
            border-radius: 0.75rem;
            font-size: 11px;
            font-weight: 500;
            color: #475569;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            margin-bottom: 0.5rem;
        }
        #result li:hover {
            border-color: #c7d2fe;
        }

        /* STATE TOGGLE BUTTON */
        .toggle-active {
            background-color: #4f46e5 !important; /* indigo */
            color: white !important;
            border-color: #4f46e5 !important;
        }

        .toggle-inactive {
            opacity: 0.4;
        }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden text-slate-900 leading-tight">

    <nav class="h-20 bg-white border-b border-slate-100 flex items-center justify-between px-8 z-30 relative">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex itemsS-center justify-center text-white font-black shadow-lg shadow-indigo-100 transform -rotate-2">M</div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight">Webgis <span class="text-indigo-600">Mapid</span></h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Mapid Bootcamp Academy</p>
            </div>
        </div>
    </nav>

    <div class="flex h-screen pt-0">
        <aside class="w-[350px] bg-white border-r border-slate-100 overflow-y-auto p-6 flex-shrink-0 z-20 scrollbar-hide">
            <div class="space-y-10 pb-20">
                
                <!-- 1. BASEMAP STYLE -->
                <section>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">1. Basemap Style</h3>
                    <div class="flex flex-col gap-2">
                        <button id="btn-street" onclick="updateStyleToStreet()" class="text-left px-5 py-3 rounded-2xl border-2 border-slate-50 bg-slate-50 text-slate-500 text-[11px] font-black hover:bg-slate-100 transition-all">MAPID Street</button>
                        <button id="btn-dark" onclick="updateStyleToDark()" class="text-left px-5 py-3 rounded-2xl border-2 border-slate-50 bg-slate-50 text-slate-500 text-[11px] font-black hover:bg-slate-100 transition-all">MAPID Dark</button>
                        <button id="btn-satellite" onclick="updateStyleToSatellite()" class="text-left px-5 py-3 rounded-2xl border-2 border-slate-50 bg-slate-50 text-slate-500 text-[11px] font-black hover:bg-slate-100 transition-all">MAPID Satellite</button>
                    </div>
                </section>

                <!-- 2. POINT STYLING & FILTER -->
                <section>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">2. Point Styling</h3>
                    <div class="bg-slate-50 rounded-3xl p-5 space-y-4">
                        <div class="flex items-center justify-between">
                          
                          <div class="flex gap-2">
                            <div class="w-3 h-3 bg-blue-500 rounded-full"></div>
                              <span class="text-[11px] font-black text-slate-700 uppercase">Apartement</span>
                          </div>
                            <button id="toggle-apartemen-layer" onclick="toggleLayerApartemen()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white shadow-sm border border-slate-200 text-indigo-600 hover:bg-slate-100 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                        <div class="flex flex-col gap-3">
                            <div class="space-y-2">
                                <label class="text-[9px] font-bold text-slate-400 uppercase">Color</label>
                                <input type="color" value="#3b82f6" oninput="setPaint('apartemen-layer', 'circle-color', this.value)" class="w-full h-8 rounded-xl cursor-pointer bg-white border border-slate-200 p-0.5">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[9px] font-bold text-slate-400 uppercase">Opacity</label>
                                <input type="range" min="0" max="1" step="0.1" value="0.8" oninput="setPaint('apartemen-layer', 'circle-opacity', parseFloat(this.value))" class="w-full h-8 mt-1 accent-indigo-600">
                            </div>
                        </div>
                        <select onchange="applyFilter('KECAMATAN', this.value)" class="w-full p-3 rounded-xl bg-white border border-slate-200 text-[11px] font-black text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            <option value="all">Semua Kecamatan</option>
                            <option value="UJUNGBERUNG">Ujungberung</option>
                            <option value="SUKAJADI">Sukajadi</option>
                            <option value="LENGKONG">Lengkong</option>
                            <option value="KIARACONDONG">Kiaracondong</option>
                            <option value="ARCAMANIK">Arcamanik</option>
                            <option value="COBLONG">Coblong</option>
                            <option value="CIDADAP">Cidadap</option>
                            <option value="CICENDO">Cicendo</option>
                            <option value="ANDIR">Andir</option>
                            <option value="BANDUNG KIDUL">Bandung Kidul</option>
                            <option value="CIBEUNYING KIDUL">Cibeunying Kidul</option>
                            <option value="BUAHBATU">Buahbatu</option>
                            <option value="BOJONGLOA KIDUL">Bojongloa Kidul</option>
                            <option value="SUMUR BANDUNG">Sumur Bandung</option>
                            <option value="SUKASARI">Sukasari</option>
                            <option value="BANDUNG WETAN">Bandung Wetan</option>
                        </select>
                    </div>
                </section>

                <!-- 2. Polygon Styling -->
                <section>
                    <h3 class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4 italic">2. Polygon Styling</h3>
                        <!-- Polygon Controls -->
                        <div class="p-5 bg-slate-50 border border-slate-100 rounded-3xl space-y-4 shadow-sm">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <div class="w-3 h-3 bg-indigo-500 rounded-sm"></div>
                                    <span class="text-[11px] font-black text-indigo-900 uppercase">Batas Administrasi</span>
                                </div>
                                <button id="toggle-administrasi-layer" onclick="toggleLayerAdministrasi()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-indigo-200 text-indigo-600 shadow-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                </button>
                            </div>
                            <div class="flex flex-col gap-3">
                                <div class="space-y-1.5">
                                    <label class="text-[9px] text-indigo-400 font-bold uppercase">Color</label>
                                    <input type="color" value="#3b82f6" oninput="setPaint('administrasi-layer', 'fill-color', this.value)" class="w-full h-8 rounded-xl cursor-pointer bg-white border border-indigo-100 p-0.5">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[9px] text-indigo-400 font-bold uppercase">Opacity</label>
                                    <input type="range" min="0" max="1" step="0.1" value="0.3" oninput="setPaint('administrasi-layer', 'fill-opacity', parseFloat(this.value))" class="w-full h-8 mt-1 accent-indigo-600">
                                </div>
                            </div>
                        </div>
                </section>

                <!-- Line Styling -->
                <section>
                    <h3 class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4 italic">3. Line Styling</h3>

                                          <!-- Line Controls -->
                        <div class="p-5 bg-slate-50 border border-slate-100 rounded-3xl space-y-4 shadow-sm">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <div class="w-3 h-0.5 bg-blue-500 rounded-full"></div>
                                    <span class="text-[11px] font-black text-blue-900 uppercase tracking-tight">Drainase</span>
                                </div>
                                <button id="toggle-drainase-layer" onclick="toggleLayerDrainase()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-blue-200 text-blue-600 shadow-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                </button>
                            </div>
                            <div class="flex flex-col gap-3">
                                <div class="space-y-1.5">
                                    <label class="text-[9px] text-blue-400 font-bold uppercase">Color</label>
                                    <input type="color" value="#3b82f6" oninput="setPaint('drainase-layer', 'line-color', this.value)" class="w-full h-8 rounded-xl cursor-pointer bg-white border border-blue-100 p-0.5">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[9px] text-blue-400 font-bold uppercase">Opacity</label>
                                    <input type="range" min="0" max="1" step="0.1" value="0.7" oninput="setPaint('drainase-layer', 'line-opacity', parseFloat(this.value))" class="w-full h-8 mt-1 accent-blue-600">
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[9px] text-blue-400 font-bold uppercase">Ketebalan</label>
                                <input type="range" min="0.5" max="8" step="0.5" value="1.5" oninput="setPaint('drainase-layer', 'line-width', parseFloat(this.value))" class="w-full h-1 bg-blue-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                            </div>
                        </div>
                </section>

                <section>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 italic">4. Buffer Analysis</h3>
                    
                    <div class="p-5 bg-slate-50 border border-slate-100 rounded-3xl space-y-4 shadow-sm">
                        
                        <div class="space-y-2">
                            <label for="radius" class="text-[9px] font-bold text-slate-400 uppercase">Radius (Kilometer)</label>
                            <input
                                type="number"
                                id="radius"
                                name="radius"
                                value="1"
                                step="0.1"
                                class="w-full p-3 rounded-xl bg-white border border-slate-200 text-[11px] font-black text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                            />
                        </div>

                        <button
                            id="button-run"
                            class="w-full py-4 bg-indigo-600 text-white rounded-2xl text-[11px] font-black uppercase tracking-widest shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center"
                        >
                            Jalankan Analisis
                        </button>

                        <div id="loading" style="display: none" class="w-full py-4 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center justify-center gap-3">
                            <svg class="w-5 h-5 animate-spin text-indigo-600" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span class="text-[11px] font-black text-indigo-600 uppercase tracking-widest">Memproses...</span>
                        </div>

                        <div class="pt-4 border-t border-slate-200/60">
                            <p class="text-[9px] font-bold text-slate-400 uppercase mb-3">Hasil Pencarian</p>
                            <ul id="result" class="space-y-2 max-h-[200px] overflow-y-auto scrollbar-hide">
                                <li class="text-[11px] text-slate-400 italic">Belum ada hasil...</li>
                            </ul>
                        </div>
                    </div>
                </section>
            </div>
        </aside>

        <main class="flex-grow bg-slate-100 relative">
            <div id="map" class="w-full h-full"></div>
        
        </main>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
